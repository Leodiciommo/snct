# Trecho para o servidor da CTI: entrega ao portal apenas /snct/AAAA e /snct/api.
# /snct e as edições antigas (/snct/2025, 2024...) continuam no Joomla.
location ~ ^/snct/(20[2-9][0-9])(/|$) { proxy_pass http://127.0.0.1:3000; include snct-proxy.inc; }
location /snct/api/                  { proxy_pass http://127.0.0.1:3000; include snct-proxy.inc; }
