<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>SNCT IFSP Caraguatatuba 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
    <style>
        :root {
            --c1: #4f2a7d;
            --c2: #2e9a46;
            --bg: #f3f6f8;
            --fg: #1b2a35;
            --card: #fff;
            --ln: #d3dde4;
            --mu: #587080;
            --ok: #1b7f4b;
            --wa: #a86a00;
            --er: #b3261e;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #0e1a22;
                --fg: #e6eef3;
                --card: #16262f;
                --ln: #2a3d49;
                --mu: #9bb1bf;
                --ok: #5fd397;
                --wa: #f0b955;
                --er: #ff8a80
            }
        }

        :root[data-theme=dark] {
            --bg: #0e1a22;
            --fg: #e6eef3;
            --card: #16262f;
            --ln: #2a3d49;
            --mu: #9bb1bf;
            --ok: #5fd397;
            --wa: #f0b955;
            --er: #ff8a80
        }

        * {
            box-sizing: inherit
        }

        html,
        body {
            height: auto
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.5 'Source Sans 3', system-ui, sans-serif
        }

        h1,
        h2,
        h3 {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            margin: 0 0 .5rem;
            line-height: 1.15
        }

        header {
            background: var(--c1);
            color: #fff;
            padding: 1.2rem 1rem .6rem
        }

        .hero {
            max-width: 1200px;
            margin: auto
        }

        .hero h1 {
            font-size: clamp(1.6rem, 5vw, 2.8rem)
        }

        .hero p {
            margin: 0;
            opacity: .85
        }

        .hero b {
            color: var(--c2)
        }

        nav {
            display: flex;
            gap: .25rem;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            max-width: 1200px;
            margin: .6rem auto 0;
            align-items: center
        }

        .simrow {
            display: flex;
            gap: .5rem;
            max-width: 1200px;
            margin: .5rem auto 0;
            font-size: .78rem
        }

        .simrow label {
            flex: 1;
            color: #fff;
            font-size: .78rem
        }

        .simrow input,
        .simrow select {
            padding: .3rem
        }

        nav button {
            white-space: nowrap;
            flex: none;
            background: none;
            border: 0;
            color: #fff;
            padding: .55rem .9rem;
            font: inherit;
            cursor: pointer;
            border-bottom: 3px solid transparent
        }

        nav button.on {
            border-color: var(--c2);
            font-weight: 600
        }

        nav .sp {
            flex: 1
        }

        nav select {
            font: inherit;
            padding: .3rem;
            border-radius: 6px
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 1rem
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid var(--c2);
            outline-offset: 1px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--ln);
            border-radius: 8px;
            padding: .8rem;
            margin-bottom: .6rem
        }

        .btn {
            background: var(--c1);
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: .5rem .9rem;
            font: inherit;
            cursor: pointer
        }

        .btn.s {
            background: none;
            color: var(--c1);
            border: 1px solid var(--c1)
        }

        .btn.r {
            background: var(--er)
        }

        .btn.g {
            background: var(--ok)
        }

        @media(prefers-color-scheme:dark) {
            .btn.s {
                color: var(--fg);
                border-color: var(--fg)
            }
        }

        .bar {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem
        }

        .bar>* {
            flex: 1 1 150px
        }

        input,
        select,
        textarea {
            font: inherit;
            width: 100%;
            padding: .45rem;
            border: 1px solid var(--ln);
            border-radius: 6px;
            background: var(--card);
            color: var(--fg)
        }

        label {
            display: block;
            font-weight: 600;
            font-size: .92rem
        }

        label input[type=checkbox] {
            width: auto
        }

        .grid {
            display: grid;
            gap: .7rem;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr))
        }

        .w2 {
            grid-column: 1/-1
        }

        .cal {
            display: grid;
            gap: .7rem;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr))
        }

        .day h3 {
            background: var(--c1);
            color: #fff;
            padding: .4rem .6rem;
            border-radius: 6px;
            margin: 0 0 .5rem;
            font-size: 1rem
        }

        .ev {
            border-left: 5px solid var(--c2);
            cursor: default
        }

        .ev small,
        .mu {
            color: var(--mu)
        }

        .ev h4 {
            margin: .1rem 0;
            font-size: 1rem
        }

        .bd {
            display: inline-block;
            font-size: .8rem;
            padding: .1rem .5rem;
            border-radius: 99px;
            border: 1px solid currentColor;
            font-weight: 600
        }

        .bd.ok {
            color: var(--ok)
        }

        .bd.wa {
            color: var(--wa)
        }

        .bd.an {
            color: var(--c1)
        }

        .bd.er {
            color: var(--er)
        }

        @media(prefers-color-scheme:dark) {
            .bd.an {
                color: #8fd0ff
            }
        }

        .cf {
            background: color-mix(in srgb, var(--er) 12%, transparent);
            border: 1px solid var(--er);
            border-radius: 6px;
            padding: .5rem;
            margin: .4rem 0;
            color: var(--fg)
        }

        .tw {
            overflow-x: auto
        }

        table {
            border-collapse: collapse;
            font-size: .82rem;
            min-width: 100%
        }

        th,
        td {
            border: 1px solid var(--ln);
            padding: .2rem .35rem;
            min-width: 92px;
            vertical-align: top
        }

        th {
            background: var(--c1);
            color: #fff;
            position: sticky;
            top: 0
        }

        td.o {
            background: color-mix(in srgb, var(--c2) 30%, transparent)
        }

        td.x {
            background: color-mix(in srgb, var(--er) 30%, transparent);
            font-weight: 600
        }

        td.h {
            min-width: 55px;
            background: var(--card);
            font-weight: 600;
            position: sticky;
            left: 0
        }

        .i {
            cursor: pointer;
            color: var(--c1);
            border: 0;
            background: none;
            font: inherit;
            padding: 0 .2rem
        }

        @media(prefers-color-scheme:dark) {
            .i {
                color: #8fd0ff
            }
        }

        .pt {
            display: flex;
            flex-wrap: wrap;
            gap: .6rem
        }

        .pt a {
            padding: .5rem 1rem;
            border: 1px solid var(--ln);
            border-radius: 6px;
            background: var(--card);
            color: var(--fg);
            text-decoration: none
        }

        .pt .platinum {
            font-size: 1.2rem;
            border-color: var(--c2)
        }

        footer {
            background: var(--c1);
            color: #fff;
            padding: 1rem;
            text-align: center;
            font-size: .9rem
        }

        .tg {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--fg);
            color: var(--bg);
            padding: .6rem 1rem;
            border-radius: 8px;
            max-width: 90vw;
            z-index: 9
        }

        dialog {
            max-width: 640px;
            width: 92%;
            border: 1px solid var(--ln);
            border-radius: 10px;
            background: var(--card);
            color: var(--fg)
        }

        dialog p {
            margin: .25rem 0
        }

        dialog::backdrop {
            background: #0008
        }

        .ad li {
            margin: .4rem 0;
            overflow-wrap: anywhere
        }

        .ad li .btn {
            margin: .15rem 0
        }

        #bn {
            display: block;
            width: 100%;
            max-width: 960px;
            height: auto;
            margin: 0 auto;
            border-radius: 8px
        }

        #bn[hidden] {
            display: none
        }

        .sr {
            position: absolute;
            left: -9999px
        }

        #sub {
            margin-top: .5rem !important;
            font-size: .9rem;
            text-align: center
        }

        .pgc {
            max-width: 75ch
        }

        .ii {
            padding: .35rem .6rem;
            font-size: 1.15rem
        }

        @media(max-width:600px) {
            main {
                padding: .7rem
            }

            .btn {
                padding: .6rem .9rem
            }

            .hero h1 {
                font-size: 1.4rem
            }
        }

        .pp {
            border: 1px solid var(--ln);
            border-radius: 6px;
            padding: .5rem;
            margin: 0
        }

        .pp legend {
            font-weight: 600;
            font-size: .92rem
        }
    </style>
</head>

        function bq(id) { const a = S.acts.find(x => x.id == id); if (a.status == 'barrada') { a.status = a.prev && a.prev != 'barrada' ? a.prev : 'analise'; a.ver++; log('Liberada: ' + a.titulo); return render() } const j = prompt('Motivo da retenção (será mostrado ao coordenador; ex.: título genérico, texto impróprio):') || ''; if (!j.trim()) return tg('Informe o motivo.'); a.prev = a.status; a.status = 'barrada'; a.just = j; a.ver++; log('Barrada: ' + a.titulo + ' — ' + j); render() }
        function ce(id) { const a = S.acts.find(x => x.id == id); Q('#dg').innerHTML = `<h2>Corrigir atividade</h2><div class="cf">Motivo: ${E(a.just)}</div><label>Título<input id="cti" value="${E(a.titulo)}" maxlength="120"></label><label>Descrição<textarea id="cre" rows="6">${E(a.resumo)}</textarea></label><p><button class="btn" onclick="cs(${id})">Salvar e reenviar</button> <button class="btn s" onclick="Q('#dg').close()">Cancelar</button></p>`; Q('#dg').showModal() }
        function cs(id) { const a = S.acts.find(x => x.id == id), t = Q('#cti').value.trim(), r = Q('#cre').value.trim(); if (!t || !r) return alert('Preencha título e descrição.'); a.titulo = t; a.resumo = r; a.status = 'analise'; a.just = ''; a.ver++; log('Corrigida e reenviada: ' + t); Q('#dg').close(); render() }
        const jmH = L => {
            const SM = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'], ano = S.start.slice(0, 4); let prev = '', o = '';
            [...L].sort((a, b) => (a.di + a.hi).localeCompare(b.di + b.hi)).forEach(a => {
                if (a.di != prev) { o += `{tab ${SM[new Date(a.di + 'T12:00:00Z').getUTCDay()]}: ${br(a.di).slice(0, 5)}}`; prev = a.di }
                const per = a.df != a.di ? `De ${br(a.di)} a ${br(a.df)}, das` : 'Das', d = E(a.resumo).split(/\n{2,}/).map(p => p.replace(/\n/g, '<br />')).join('</p><p style="text-align: justify;">');
                o += `<p style="text-align: left;"><strong><span style="font-size: 12pt;">${E(a.titulo)}</span></strong></p><p>${per} ${a.hi} às ${a.hf} - Responsável: ${E(a.coord)} - Local: ${E(a.sala.split(' | ').slice(0, 2).join(' | '))} - Vagas: ${a.vagas}</p><p style="text-align: justify;">${d}</p>`;
                if (a.suap) o += `<p><span style="background-color: #455a64; padding: 4px;"><a href="${E(a.suap)}" target="_blank" rel="noopener noreferrer" style="color: #fff;">Inscreva-se</a></span> | <span style="background-color: #25d366; padding: 4px;"><a href="https://api.whatsapp.com/send?text=${encodeURIComponent('Olha o que tem na SNCT ' + ano + '!\r\n\r\n').replace(/!/g, '%21') + encodeURIComponent(a.suap)}" target="_blank" rel="noopener noreferrer" style="color: #fff;">Compartilhe</a></span></p>`; o += '<hr />'
            }); return o
        };
        function jm() { const h = jmH(S.acts.filter(a => a.status == 'aprovada' && (a.suap || S.phase >= S.pendFrom))); Q('#dg').innerHTML = `<h2>HTML para o site institucional</h2><p class="mu"><small>Cole no editor do Joomla, em modo código. Cada dia vira uma aba. Incluídas só as atividades aprovadas visíveis ao público.</small></p><textarea id="jmt" rows="10" readonly>${E(h)}</textarea><p><button class="btn" onclick="cpj()">Copiar</button> <button class="btn s" onclick="Q('#dg').close()">Fechar</button></p>`; Q('#dg').showModal() }
        function cpj() { const t = Q('#jmt'); t.select(); const ok = () => tg('HTML copiado.'); if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(ok, () => { document.execCommand('copy'); ok() }); else { document.execCommand('copy'); ok() } }

        if (S.def && !(S.win[1] && S.win[1].i)) calcWin();
        render(); { const h = location.hash.match(/^#a(\d+)$/); if (h) dt(+h[1]) }
    </script>
</body>
